name: Daily Game Tasks

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 8 * * *'
    - cron: '30 20 * * *'
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  morning_mission:
    if: github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Generate daily mission
        run: python scripts/generate_mission.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game_state.json
          git diff --staged --quiet || git commit -m "[auto] daily mission $(date +'%Y-%m-%d')"
          git push

  noon_rankings:
    if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Calculate and send rankings
        run: python scripts/calculate_rankings.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game_state.json
          git diff --staged --quiet || git commit -m "[auto] daily rankings $(date +'%Y-%m-%d')"
          git push

  midnight_maintenance:
    if: github.event.schedule == '30 20 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Deduct maintenance costs
        run: python scripts/deduct_maintenance.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Check inactive players
        run: python scripts/check_inactivity.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game_state.json
          git diff --staged --quiet || git commit -m "[auto] daily maintenance $(date +'%Y-%m-%d')"
          git push

  auto_resolve_wars:
    if: github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Resolve timeout wars
        run: python scripts/resolve_timeout_wars.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game_state.json
          git diff --staged --quiet || git commit -m "[auto] auto-resolve wars $(date +'%Y-%m-%d %H:%M')"
          git push

  check_disasters:
    if: github.event.schedule == '0 */12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Check and trigger disasters
        run: python scripts/disaster_system.py --check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GCC_CHAT_ID: ${{ secrets.GCC_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game_state.json
          git diff --staged --quiet || git commit -m "[auto] disaster check $(date +'%Y-%m-%d')"
          git push
