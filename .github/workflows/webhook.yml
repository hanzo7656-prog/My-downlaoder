name: Article Webhook

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'URL'
        required: true
      callback_id:
        description: 'Callback ID'
        required: true
      chat_id:
        description: 'Chat ID'
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install newspaper3k
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install newspaper3k --break-system-packages || pip3 install newspaper3k

      - name: Extract article
        run: |
          python3 << EOF
          from newspaper import Article
          import json
          
          url = "${{ github.event.inputs.article_url }}"
          
          try:
              article = Article(url)
              article.download()
              article.parse()
              
              text = article.text[:3500]
              if len(article.text) > 3500:
                  text += "..."
              
              result = {
                  "success": True,
                  "title": article.title,
                  "text": text,
                  "url": url
              }
          except Exception as e:
              result = {
                  "success": False,
                  "error": str(e),
                  "url": url
              }
          
          with open('result.json', 'w') as f:
              json.dump(result, f)
          EOF

      - name: Send to Bale
        run: |
          SUCCESS=$(jq -r '.success' result.json)
          CALLBACK_ID="${{ github.event.inputs.callback_id }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ "$SUCCESS" = "true" ]; then
            TITLE=$(jq -r '.title' result.json)
            TEXT=$(jq -r '.text' result.json)
            URL=$(jq -r '.url' result.json)
            
            MESSAGE="📰 *${TITLE}*%0A%0A${TEXT}%0A%0A━━━━━━━━━━━━━━━━━━━━%0A🔗 [منبع](${URL})%0A🤖 Fox News Bot"
            
            curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "chat_id=$CHAT_ID" \
              --data-urlencode "text=$MESSAGE" \
              --data-urlencode "parse_mode=Markdown"
          else
            ERROR=$(jq -r '.error' result.json)
            curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "chat_id=$CHAT_ID" \
              --data-urlencode "text=❌ خطا: $ERROR"
          fi
