name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          echo "Download completed"

      - name: Debug - Show links and titles
        run: |
          echo "=== ALL LINKS in page ==="
          grep -oP 'https?://www\.foxnews\.com/[^"\s]+' fox.html | sort -u | head -30
          
          echo ""
          echo "=== LINKS with date pattern (year/month/day) ==="
          grep -oP 'https?://www\.foxnews\.com/[0-9]{4}/[0-9]{2}/[0-9]{2}/[^"\s]+' fox.html | head -10
          
          echo ""
          echo "=== TITLES found ==="
          grep -oP '(?<=<h[23] class="title">)[^<]+' fox.html | head -10
          
          echo ""
          echo "=== TITLES from div.title.span ==="
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox.html | head -10
          
          echo ""
          echo "=== First 100 lines of HTML ==="
          head -100 fox.html

      - name: Commit debug file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox.html
          git commit -m "Debug fox news page" || echo "No changes"
          git push
