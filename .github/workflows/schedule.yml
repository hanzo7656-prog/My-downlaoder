name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # استخراج تیترهای اصلی (div.title span)
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox.html | head -10 | while read title; do
            title=$(echo "$title" | sed 's/"/\\"/g')
            echo "{\"title\":\"$title\",\"type\":\"main\"}," >> news.json
          done
          
          # حذف ویرگول آخر
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # نمایش نتیجه برای دیباگ
          echo "=== Extracted titles ==="
          cat news.json | head -20

      - name: Send to Bale
        run: |
          # استخراج تیترها با grep (بدون jq)
          TITLES=$(grep -o '"title":"[^"]*"' news.json | head -5 | sed 's/"title":"//;s/"//')
          
          if [ -z "$TITLES" ]; then
            TEXT="🦊 آخرین اخبار فاکس نیوز\n\nدر حال حاضر خبری یافت نشد.\n\n━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TEXT="🦊 آخرین اخبار فاکس نیوز\n\n"
            COUNT=1
            while IFS= read -r line; do
              TEXT="${TEXT}${COUNT}. ${line}\n\n"
              COUNT=$((COUNT+1))
            done <<< "$TITLES"
            TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')\n\n⚠️ لینک خبر مورد نظر را کپی کرده و برای ربات بفرستید."
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(echo '{}' | jq --arg chat "${{ secrets.CHAT_ID }}" --arg text "$TEXT" '.chat_id=$chat | .text=$text | .parse_mode="Markdown"')"

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news $(date)"
          git push origin HEAD:main
