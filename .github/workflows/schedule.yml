name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # الگوی 1: تیترهای اصلی (div.title span)
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox.html | while read title; do
            echo "{\"title\":\"$title\",\"type\":\"main\"}," >> news.json
          done
          
          # الگوی 2: تیترهای بخش‌ها (h3.title a)
          grep -oP '(?<=<h3 class="title"><a href=")[^"]+' fox.html | while read link; do
            full_link="https://www.foxnews.com$link"
            title=$(grep -A1 "href=\"$link\"" fox.html | grep -oP '(?<=>)[^<]+' | head -1)
            if [ -n "$title" ] && [ ${#title} -gt 10 ]; then
              echo "{\"title\":\"$title\",\"link\":\"$full_link\",\"type\":\"section\"}," >> news.json
            fi
          done
          
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # حذف تیترهای تکراری و کوتاه
          jq '.articles = [.articles[] | select(.title | length > 15)] | .articles = unique_by(.title)' news.json > temp.json && mv temp.json news.json

      - name: Send to Bale
        run: |
          # استخراج 5 تیتر اصلی
          TITLES=$(jq -r '.articles[] | select(.type=="main") | .title' news.json | head -5)
          
          if [ -z "$TITLES" ]; then
            TEXT="🦊 آخرین اخبار فاکس نیوز\n\nدر حال حاضر خبری یافت نشد.\n\n━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TEXT="🦊 آخرین اخبار فاکس نیوز\n\n"
            COUNT=1
            while IFS= read -r line; do
              TEXT="${TEXT}${COUNT}. ${line}\n\n"
              COUNT=$((COUNT+1))
            done <<< "$TITLES"
            TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')\n\n⚠️ لینک خبر مورد نظر را کپی کرده و برای ربات بفرستید."
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat "${{ secrets.CHAT_ID }}" --arg text "$TEXT" '{chat_id: $chat, text: $text, parse_mode: "Markdown"}')"

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news $(date)"
          git push origin HEAD:main
