name: Fox News Smart Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          echo "Downloaded at $(date)" > log.txt

      - name: Smart Extraction
        run: |
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # ============================================
          # لایه 1: الگوهای دقیق (بر اساس تحلیل قبلی)
          # ============================================
          
          # الگوی 1: h2 class="title" > a
          grep -oP '<h2 class="title"><a href="\K[^"]+' fox.html | while read link; do
            clean_link=$(echo "$link" | sed 's/^\/\///' | sed 's/^https:\/\/www\.foxnews\.com\///')
            if [[ $clean_link != http* ]]; then
              full_link="https://www.foxnews.com/$clean_link"
            else
              full_link="$clean_link"
            fi
            title=$(grep -B1 -A1 "href=\"$link\"" fox.html | grep -oP '(?<=>)[^<]+' | head -1 | sed 's/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g')
            if [ -n "$title" ] && [ ${#title} -gt 10 ] && [ ${#title} -lt 200 ]; then
              echo "{\"title\":\"$title\",\"link\":\"$full_link\",\"method\":\"h2-title\"}," >> news.json
            fi
          done
          
          # الگوی 2: h3 class="title" > a
          grep -oP '<h3 class="title"><a href="\K[^"]+' fox.html | while read link; do
            clean_link=$(echo "$link" | sed 's/^\/\///' | sed 's/^https:\/\/www\.foxnews\.com\///')
            if [[ $clean_link != http* ]]; then
              full_link="https://www.foxnews.com/$clean_link"
            else
              full_link="$clean_link"
            fi
            title=$(grep -B1 -A1 "href=\"$link\"" fox.html | grep -oP '(?<=>)[^<]+' | head -1 | sed 's/&amp;/\&/g')
            if [ -n "$title" ] && [ ${#title} -gt 15 ] && [ ${#title} -lt 200 ]; then
              if ! grep -q "$full_link" news.json; then
                echo "{\"title\":\"$title\",\"link\":\"$full_link\",\"method\":\"h3-title\"}," >> news.json
              fi
            fi
          done
          
          # ============================================
          # لایه 2: الگوهای عمومی (Fallback)
          # ============================================
          
          # اگر خبری پیدا نشد، از لایه دوم استفاده کن
          CURRENT_COUNT=$(grep -c '"method"' news.json)
          
          if [ "$CURRENT_COUNT" -lt 5 ]; then
            echo "// FALLBACK: Extracting from general patterns" >> news.json
            
            # جستجوی همه لینک‌های خبری با فرمت استاندارد
            grep -oP 'https?://www\.foxnews\.com/([a-z-]+/)?(20[0-9]{2}/[0-9]{2}/[0-9]{2}/|[a-z-]+-)[0-9]+' fox.html | sort -u | while read link; do
              # پیدا کردن تیتر مجاور
              title=$(grep -B5 -A5 "$link" fox.html | grep -oP '(?<=<h[23] class="title">)[^<]+' | head -1)
              if [ -z "$title" ]; then
                title=$(grep -B5 -A5 "$link" fox.html | grep -oP '(?<=<div class="title"><span>)[^<]+' | head -1)
              fi
              if [ -z "$title" ]; then
                title=$(grep -B5 -A5 "$link" fox.html | grep -oP '(?<=aria-label=")[^"]+' | head -1)
              fi
              
              if [ -n "$title" ] && [ ${#title} -gt 10 ] && [ ${#title} -lt 200 ]; then
                title=$(echo "$title" | sed 's/"/\\"/g' | sed 's/&amp;/\&/g')
                echo "{\"title\":\"$title\",\"link\":\"$link\",\"method\":\"fallback\"}," >> news.json
              fi
            done
          fi
          
          # ============================================
          # لایه 3: ذخیره ساختار برای دیباگ (اگر خبری پیدا نشد)
          # ============================================
          
          FINAL_COUNT=$(grep -c '"method"' news.json)
          
          if [ "$FINAL_COUNT" -lt 3 ]; then
            echo "// DEBUG: No articles found, saving structure sample" >> news.json
            echo "{\"title\":\"SITE_STRUCTURE_CHANGED\",\"link\":\"https://www.foxnews.com\",\"method\":\"debug\"}," >> news.json
            # ذخیره نمونه از HTML برای بررسی
            echo "<!-- SAMPLE OF HTML FOR DEBUG -->" > debug.html
            head -500 fox.html >> debug.html
          fi
          
          # پاکسازی نهایی
          sed -i 's|https://www.foxnews.com//|https://www.foxnews.com/|g' news.json
          sed -i 's|https://www.foxnews.com/https://|https://|g' news.json
          sed -i '/"link": "https:\/\/www\.foxnews\.com\/$/d' news.json
          sed -i '/"title": ""/d' news.json
          sed -i '/"title": " "/d' news.json
          sed -i '/"link": "https:\/\/www\.foxnews\.com\/#" /d' news.json
          
          # حذف تیترهای کوتاه و بی‌مفهوم
          sed -i '/"title": "Games Hub"/d' news.json
          sed -i '/"title": "Fox Nation"/d' news.json
          sed -i '/"title": "Deals"/d' news.json
          sed -i '/"title": "FOX Business"/d' news.json
          
          # حذف ویرگول اضافی و بستن JSON
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # حذف تکراری‌ها
          jq '.articles = [.articles[] | select(.title != null and .title != "" and .title != "SITE_STRUCTURE_CHANGED")] | .articles = unique_by(.link)' news.json > temp.json && mv temp.json news.json
          
          # گزارش نهایی
          COUNT=$(jq '.articles | length' news.json)
          echo "✅ Extracted $COUNT articles" >> log.txt
          
          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: No articles found! Site structure may have changed." >> log.txt
          fi

      - name: Smart Deduplication and Filtering
        run: |
          # حذف لینک‌های تکراری با دقت بیشتر
          python3 << 'EOF'
          import json
          
          with open('news.json', 'r') as f:
              data = json.load(f)
          
          # حذف تکراری‌ها بر اساس لینک
          seen = set()
          unique_articles = []
          for article in data['articles']:
              link = article.get('link', '')
              # حذف لینک‌های تکراری و بی‌مفهوم
              if link and link not in seen and 'foxnews.com' in link:
                  # حذف لینک‌های صفحات اصلی
                  if not link.endswith('/foxnews.com') and not link.endswith('/foxnews.com/'):
                      seen.add(link)
                      # پاک کردن method از خروجی نهایی (برای تمیزی)
                      if 'method' in article:
                          del article['method']
                      unique_articles.append(article)
          
          data['articles'] = unique_articles[:15]  # فقط 15 خبر اول
          
          with open('news.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          EOF
          
          echo "✅ After deduplication: $(jq '.articles | length' news.json) articles"

      - name: Send to Bale
        run: |
          COUNT=$(jq '.articles | length' news.json)
          
          if [ "$COUNT" -eq 0 ]; then
            TEXT="⚠️ *خطا در دریافت اخبار*%0A%0A"
            TEXT="${TEXT}ساختار سایت فاکس نیوز احتمالاً تغییر کرده است.%0A"
            TEXT="${TEXT}لطفاً به مخزن گیت‌هاب مراجعه کرده و فایل \`fox.html\` را بررسی کنید.%0A%0A"
            TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━%0A📅 $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TEXT="🦊 *آخرین اخبار فاکس نیوز*%0A%0A"
            
            for i in $(seq 0 $(($COUNT-1))); do
              TITLE=$(jq -r ".articles[$i].title" news.json | sed 's/&amp;/\&/g')
              LINK=$(jq -r ".articles[$i].link" news.json)
              
              if [ "$TITLE" != "null" ] && [ -n "$TITLE" ] && [ ${#TITLE} -gt 5 ]; then
                # محدود کردن طول تیتر
                if [ ${#TITLE} -gt 80 ]; then
                  TITLE="${TITLE:0:77}..."
                fi
                TEXT="${TEXT}• ${TITLE}%0Aلینک: ${LINK}%0A%0A"
              fi
            done
          fi
          
          TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━%0A📅 $(date '+%Y-%m-%d %H:%M:%S')%0A%0A"
          
          if [ "$COUNT" -gt 0 ]; then
            TEXT="${TEXT}✅ ${COUNT} خبر یافت شد%0A⚠️ برای خواندن هر خبر، لینک آن را برای ربات بفرستید."
          fi
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.CHAT_ID }}\", \"text\": \"$TEXT\", \"parse_mode\": \"Markdown\"}"

      - name: Save Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json fox.html log.txt
          git diff --staged --quiet || git commit -m "Smart update $(date +%Y%m%d-%H%M%S)"
          git push origin HEAD:main
