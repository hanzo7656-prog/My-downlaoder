name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # استخراج لینک‌های خبری
          grep -oP 'href="\K[^"]+' fox.html | grep -E '^/[a-z]|https://www.foxnews.com/[a-z]' | while read link; do
            if [[ $link != http* ]]; then
              link="https://www.foxnews.com$link"
            fi
            
            # پیدا کردن تیتر مرتبط
            title=$(grep -B5 -A5 "$link" fox.html | grep -oP '(?<=<h[23] class="title">)[^<]+' | head -1)
            
            if [ -n "$title" ] && [ ${#title} -gt 15 ]; then
              title=$(echo "$title" | sed 's/"/\\"/g')
              echo "{\"title\":\"$title\",\"link\":\"$link\"}," >> news.json
            fi
          done
          
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # فقط 10 خبر اول
          head -15 news.json > temp.json && mv temp.json news.json

      - name: Send to Bale with Buttons
        run: |
          # ساخت دکمه‌های شیشه‌ای
          BUTTONS=""
          COUNT=0
          
          jq -c '.articles[]' news.json | head -8 | while read article; do
            TITLE=$(echo "$article" | jq -r '.title' | cut -c1-35)
            URL=$(echo "$article" | jq -r '.link')
            
            if [ $COUNT -eq 0 ]; then
              BUTTONS="${BUTTONS}["
            fi
            
            BUTTONS="${BUTTONS}{\"text\":\"$TITLE\",\"callback_data\":\"$URL\"},"
            COUNT=$((COUNT+1))
            
            if [ $COUNT -eq 2 ]; then
              BUTTONS="${BUTTONS}],"
              COUNT=0
            fi
          done
          
          # حذف ویرگول اضافی
          BUTTONS=$(echo "$BUTTONS" | sed 's/,$//')
          KEYBOARD="{\"inline_keyboard\":[$BUTTONS]}"
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.CHAT_ID }}\",\"text\":\"🦊 *آخرین اخبار فاکس نیوز*%0A%0Aروی هر خبر کلیک کنید:\",\"parse_mode\":\"Markdown\",\"reply_markup\":$KEYBOARD}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update $(date)" || echo "No changes"
          git push
