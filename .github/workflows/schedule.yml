name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # روش 1: استخراج لینک از a مجاور div.title
          grep -A2 -B2 '<div class="title"><span>' fox.html | grep -oP 'href="\K[^"]+' | grep -E '^/20[0-9]{2}|^/[a-z]' | head -10 > links.txt
          
          # استخراج تیترها
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox.html | head -10 > titles.txt
          
          # ترکیب و تمیز کردن
          paste titles.txt links.txt 2>/dev/null | while IFS=$'\t' read title link; do
            if [ -n "$title" ] && [ -n "$link" ] && [ ${#title} -gt 15 ]; then
              title=$(echo "$title" | sed 's/"/\\"/g')
              if [[ $link != https* ]]; then
                link="https://www.foxnews.com$link"
              fi
              # حذف لینک‌های تکراری و نامعتبر
              if [[ $link != *"nation.foxnews.com"* ]] && [[ $link != *"radio.foxnews.com"* ]] && [[ $link != *"noticias.foxnews.com"* ]] && [[ $link != *"/books"* ]]; then
                echo "{\"title\":\"$title\",\"link\":\"$link\"}," >> news.json
              fi
            fi
          done
          
          # روش 2: اگر روش اول لینکی نداشت، از لینک‌های داخل article استفاده کن
          if [ ! -s news.json ] || [ "$(grep -c '"link"' news.json)" -lt 3 ]; then
            grep -oP 'https?://www\.foxnews\.com/[a-z/-]+/[0-9]+' fox.html | sort -u | head -5 > links2.txt
            grep -oP '(?<=<h[23] class="title">)[^<]+' fox.html | head -5 > titles2.txt
            paste titles2.txt links2.txt 2>/dev/null | while IFS=$'\t' read title link; do
              if [ -n "$title" ] && [ -n "$link" ]; then
                title=$(echo "$title" | sed 's/"/\\"/g')
                echo "{\"title\":\"$title\",\"link\":\"$link\"}," >> news.json
              fi
            done
          fi
          
          # حذف لینک‌های تکراری و ویرگول آخر
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # حذف تیترهای تکراری
          cat news.json | head -20

      - name: Send to Bale
        run: |
          TEXT="🦊 آخرین اخبار فاکس نیوز\n\n"
          
          for i in 1 2 3 4 5; do
            TITLE=$(grep -o '"title":"[^"]*"' news.json | sed -n "${i}p" | sed 's/"title":"//;s/"//')
            LINK=$(grep -o '"link":"[^"]*"' news.json | sed -n "${i}p" | sed 's/"link":"//;s/"//')
            
            if [ -n "$TITLE" ] && [ -n "$LINK" ]; then
              TEXT="${TEXT}${i}. ${TITLE}\nلینک: ${LINK}\n\n"
            fi
          done
          
          TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')\n\n⚠️ لینک خبر مورد نظر را کپی کرده و برای ربات بفرستید."
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.CHAT_ID }}\", \"text\": \"$TEXT\", \"parse_mode\": \"Markdown\"}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news $(date)" || echo "No changes"
          git push
