name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines and Links
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          # استخراج لینک‌ها و تیترها از h2.title و h3.title
          grep -oP '<h[23] class="title"><a href="\K[^"]+' fox.html | while read link; do
            full_link="https://www.foxnews.com$link"
            
            # پیدا کردن تیتر مرتبط با این لینک
            title=$(grep -A1 "<a href=\"$link\"" fox.html | grep -oP '(?<=>)[^<]+' | head -1)
            
            if [ -n "$title" ] && [ ${#title} -gt 15 ]; then
              title=$(echo "$title" | sed 's/"/\\"/g')
              echo "{\"title\":\"$title\",\"link\":\"$full_link\"}," >> news.json
            fi
          done
          
          # اضافه کردن لینک‌های live-news
          grep -oP 'https://www\.foxnews\.com/live-news/[^"\s]+' fox.html | head -5 | while read link; do
            if ! grep -q "$link" news.json; then
              title=$(grep -B2 "$link" fox.html | grep -oP '(?<=<h3 class="title">)[^<]+' | head -1)
              if [ -n "$title" ]; then
                title=$(echo "$title" | sed 's/"/\\"/g')
                echo "{\"title\":\"$title\",\"link\":\"$link\"}," >> news.json
              fi
            fi
          done
          
          # حذف لینک‌های تکراری
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # حذف موارد خالی و تکراری
          jq '.articles = [.articles[] | select(.title != null and .title != "")] | .articles = unique_by(.link)' news.json > temp.json && mv temp.json news.json
          
          echo "Extracted $(jq '.articles | length' news.json) articles"

      - name: Send to Bale
        run: |
          TEXT="🦊 *آخرین اخبار فاکس نیوز*\n\n"
          
          # خواندن 10 خبر اول از news.json
          for i in $(seq 0 9); do
            TITLE=$(jq -r ".articles[$i].title" news.json)
            LINK=$(jq -r ".articles[$i].link" news.json)
            
            if [ "$TITLE" != "null" ] && [ -n "$TITLE" ]; then
              TEXT="${TEXT}• ${TITLE}\nلینک: ${LINK}\n\n"
            fi
          done
          
          TEXT="${TEXT}━━━━━━━━━━━━━━━━━━━━\n📅 $(date '+%Y-%m-%d %H:%M:%S')\n\n⚠️ برای خواندن هر خبر، لینک آن را برای ربات بفرستید."
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.CHAT_ID }}\", \"text\": \"$TEXT\", \"parse_mode\": \"Markdown\"}"

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json fox.html
          git diff --staged --quiet || git commit -m "Update news $(date)"
          git push origin HEAD:main
