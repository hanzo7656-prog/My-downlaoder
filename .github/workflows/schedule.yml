name: Fox News Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Headlines
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          grep -oP 'href="\K[^"]+' fox.html | grep -E '^/[a-z]|https://www.foxnews.com/[a-z]' | while read link; do
            if [[ $link != http* ]]; then
              link="https://www.foxnews.com$link"
            fi
            
            title=$(grep -B5 -A5 "$link" fox.html | grep -oP '(?<=<h[23] class="title">)[^<]+' | head -1)
            
            if [ -n "$title" ] && [ ${#title} -gt 15 ]; then
              title=$(echo "$title" | sed 's/"/\\"/g')
              echo "{\"title\":\"$title\",\"link\":\"$link\"}," >> news.json
            fi
          done
          
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json

      - name: Send to Bale
        run: |
          TITLES=$(jq -r '.articles[0:5][] | "• " + .title + "\nلینک: " + .link + "\n"' news.json)
          MESSAGE="🦊 *آخرین اخبار فاکس نیوز*%0A%0A${TITLES}%0A━━━━━━━━━━━━━━━━━━━━%0A📅 $(date '+%Y-%m-%d %H:%M:%S')%0A%0A⚠️ برای خواندن هر خبر، لینک آن را برای ربات بفرستید."
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "chat_id=${{ secrets.CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            --data-urlencode "parse_mode=Markdown"

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news $(date)"
          git push origin HEAD:main
