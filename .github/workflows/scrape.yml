- name: Send to Bale (No jq)
  run: |
    # ساختن فایل JSON موقت
    echo "{" > payload.json
    echo "  \"chat_id\": \"${{ secrets.BALE_CHAT_ID }}\"," >> payload.json
    echo "  \"text\": \"🦊 *اخبار لحظه‌ای فاکس نیوز*\n\n" >> payload.json
    
    COUNT=1
    while IFS= read -r line; do
      if [ -n "$line" ]; then
        echo "  \"$COUNT. $line\n\n\"" >> payload.json
        COUNT=$((COUNT+1))
      fi
    done < headlines.txt
    
    echo "  \"━━━━━━━━━━━━━━━━━━━━\n" >> payload.json
    echo "  \"📅 $(date '+%Y-%m-%d %H:%M:%S')\n" >> payload.json
    echo "  \"🔗 [مشاهده همه اخبار](https://raw.githubusercontent.com/${{ github.repository }}/main/news.json)\n\n" >> payload.json
    echo "  \"🤖 Fox News Bot\"," >> payload.json
    echo "  \"parse_mode\": \"Markdown\"" >> payload.json
    echo "}" >> payload.json
    
    curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
      -H "Content-Type: application/json" \
      -d @payload.json
