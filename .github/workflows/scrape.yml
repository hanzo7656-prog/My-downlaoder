name: Fox News with Headlines

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html
          
          # روش ساده برای استخراج تیتر: جستجوی خطوطی که شبیه تیتر هستند
          grep -E '(class="title"|class="headline")' fox_news.html | \
            sed 's/<[^>]*>//g' | \
            sed 's/^[ \t]*//' | \
            grep -v "^$" | \
            head -30 > headlines.txt
          
          # ساخت JSON ساده
          echo '{
  "source": "foxnews",
  "timestamp": "'$(date -Iseconds)'",
  "headlines": [' > news.json
          
          while IFS= read -r line; do
            # حذف نقل قول و کاراکترهای خاص
            clean_line=$(echo "$line" | sed 's/"/\\"/g')
            echo "  \"$clean_line\"," >> news.json
          done < headlines.txt
          
          # حذف ویرگول آخر و بستن JSON
          sed -i '$ s/,$//' news.json
          echo '  ]' >> news.json
          echo '}' >> news.json
          
          echo "✅ Found $(wc -l < headlines.txt) headlines"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox_news.html headlines.txt news.json
          git commit -m "Update news - $(date -Iseconds)" || echo "No changes"
          git push
