name: Fox News to Bale (Final)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html

      - name: Extract Headlines
        run: |
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -7 > headlines.txt

      - name: Send to Bale
        run: |
          # ساخت فایل موقت با خطوط جدید واقعی
          {
            echo "🦊 اخبار لحظه‌ای فاکس نیوز"
            echo ""
            
            COUNT=1
            while read line; do
              echo "$COUNT. $line"
              echo ""
              COUNT=$((COUNT+1))
            done < headlines.txt
            
            echo "━━━━━━━━━━━━━━━━━━━━"
            echo "📅 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🔗 https://raw.githubusercontent.com/${{ github.repository }}/main/news.json"
            echo ""
            echo "🤖 Fox News Bot"
          } > message.txt
          
          # ارسال
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "chat_id=${{ secrets.BALE_CHAT_ID }}" \
            --data-urlencode "text=$(cat message.txt)" \
            --data-urlencode "parse_mode=Markdown"

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox_news.html headlines.txt
          git commit -m "Update $(date)" || echo "No changes"
          git push
