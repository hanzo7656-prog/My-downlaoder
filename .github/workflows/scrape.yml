name: Simple Fox News Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Download and save Fox News
        run: |
          # دانلود صفحه اصلی
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html
          
          # یک فایل JSON ساده بساز
          echo '{"status":"success","time":"'$(date)'","file":"fox_news.html"}' > result.json
          
          echo "Done. Files are ready."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fox-news-output
          path: |
            fox_news.html
            result.json
