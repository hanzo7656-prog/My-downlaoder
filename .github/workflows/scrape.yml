name: Simple Fox News Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" \
               https://www.foxnews.com/ > fox.html
          
          # فقط خطوط حاوی عنوان را ذخیره کن (برای دیباگ)
          grep -i "title" fox.html | head -20 > titles.txt
          
          echo "Done at $(date)" > info.txt
      
      - name: Save
        run: |
          git add .
          git commit -m "Downloaded fox news" || echo "No changes"
          git push
