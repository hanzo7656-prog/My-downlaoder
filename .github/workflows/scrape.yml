name: Simple Fox News Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download Fox News
        run: |
          # دانلود صفحه اصلی
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html
          
          # یک فایل متنی ساده بسازیم (مطمئن)
          echo "This is a test file" > test.txt
          echo "Download completed at: $(date)" >> test.txt
          
          # یک فایل JSON ساده
          echo '{"status":"success","time":"'$(date)'"}' > result.json
          
          # لیست فایل‌های ساخته شده
          ls -la
      
      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox_news.html test.txt result.json
          git commit -m "Add downloaded files - $(date)" || echo "No new files to commit"
          git push
