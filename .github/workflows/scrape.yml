      - name: Send to Bale (Pure Bash)
        run: |
          # ساخت فایل موقت برای متن
          cat > message.txt << 'EOF'
🦊 اخبار لحظه‌ای فاکس نیوز


EOF
          
          COUNT=1
          while IFS= read -r line; do
            echo "${COUNT}. ${line}" >> message.txt
            echo "" >> message.txt
            COUNT=$((COUNT+1))
          done < headlines.txt
          
          echo "━━━━━━━━━━━━━━━━━━━━" >> message.txt
          echo "📅 $(date '+%Y-%m-%d %H:%M:%S')" >> message.txt
          echo "🔗 مشاهده همه اخبار: https://raw.githubusercontent.com/${{ github.repository }}/main/news.json" >> message.txt
          echo "" >> message.txt
          echo "🤖 Fox News Bot" >> message.txt
          
          # خواندن متن و تبدیل به JSON
          TEXT=$(cat message.txt | sed 's/"/\\"/g')
          
          curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.BALE_CHAT_ID }}\", \"text\": \"$TEXT\", \"parse_mode\": \"Markdown\"}"
