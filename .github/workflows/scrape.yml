name: Debug Fox News HTML

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download and Analyze
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox.html
          
          # جستجوی الگوهای مختلف تیتر
          echo "=== Searching for headlines ===" > debug.txt
          grep -i "headline" fox.html | head -10 >> debug.txt
          echo "=== H2 tags ===" >> debug.txt
          grep "<h2" fox.html | head -10 >> debug.txt
          echo "=== H3 tags ===" >> debug.txt
          grep "<h3" fox.html | head -10 >> debug.txt
          echo "=== Links ===" >> debug.txt
          grep "href=" fox.html | head -20 >> debug.txt
      
      - name: Save Debug
        run: |
          git add fox.html debug.txt
          git commit -m "Debug HTML structure" || echo "No changes"
          git push
