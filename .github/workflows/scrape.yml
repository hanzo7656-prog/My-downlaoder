name: Fox News to Bale (Final)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fox News
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html
          echo "Downloaded at $(date)"

      - name: Extract Headlines
        run: |
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -10 > headlines.txt
          echo "✅ Extracted $(wc -l < headlines.txt) headlines"

      - name: Send to Bale
        run: |
          # ساخت پیام
          MESSAGE="🦊 *اخبار لحظه‌ای فاکس نیوز*%0A%0A"
          COUNT=1
          
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              MESSAGE="$MESSAGE$COUNT. $line%0A%0A"
              COUNT=$((COUNT+1))
            fi
          done < headlines.txt
          
          MESSAGE="$MESSAGE%0A📅 $(date '+%Y-%m-%d %H:%M:%S')%0A%0A🔗 [مشاهده همه اخبار](https://raw.githubusercontent.com/${{ github.repository }}/main/news.json)"
          
          # ارسال به بله با آدرس درست
          RESPONSE=$(curl -s -X POST "https://tapi.bale.ai/bot${{ secrets.BALE_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.BALE_CHAT_ID }}\",\"text\":\"$MESSAGE\",\"parse_mode\":\"Markdown\"}")
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Message sent successfully"
          else
            echo "❌ Failed to send message"
            exit 1
          fi

      - name: Save and Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox_news.html headlines.txt
          git commit -m "Fox News update $(date)" || echo "No changes"
          git push
