name: Fox News Professional Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Fox News homepage
        run: |
          echo "Downloading Fox News..."
          curl -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               https://www.foxnews.com/ > fox_news.html
          echo "Downloaded: $(wc -c < fox_news.html) bytes"

      - name: Extract ALL headlines using discovered patterns
        run: |
          echo "{" > news.json
          echo "  \"source\": \"foxnews.com\"," >> news.json
          echo "  \"timestamp\": \"$(date -Iseconds)\"," >> news.json
          echo "  \"articles\": [" >> news.json
          
          # الگوی 1: div class="title" (تیترهای بزرگ صفحه اصلی)
          echo "    // === TOP STORIES (div.title) === //," >> news.json
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -20 | while read line; do
            clean=$(echo "$line" | sed 's/"/\\"/g')
            echo "    {\"title\": \"$clean\", \"type\": \"top-story\"}," >> news.json
          done
          
          # الگوی 2: h3 class="title" (تیترهای بخش‌های مختلف)
          echo "    // === FEATURED (h3.title) === //," >> news.json
          grep -oP '(?<=<h3 class="title">)[^<]*' fox_news.html | grep -v "^$" | head -20 | while read line; do
            clean=$(echo "$line" | sed 's/"/\\"/g' | sed 's/^[ \t]*//;s/[ \t]*$//')
            if [ ${#clean} -gt 15 ]; then
              echo "    {\"title\": \"$clean\", \"type\": \"featured\"}," >> news.json
            fi
          done
          
          # الگوی 3: div class="title" (تیترهای بخش Features & Faces)
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -20 | while read line; do
            clean=$(echo "$line" | sed 's/"/\\"/g')
            echo "    {\"title\": \"$clean\", \"type\": \"feature\"}," >> news.json
          done
          
          # حذف ویرگول اضافی آخر و بستن JSON
          sed -i '$ s/,$//' news.json
          echo "  ]" >> news.json
          echo "}" >> news.json
          
          # ایجاد گزارش ساده از تیترها
          echo "FOX NEWS HEADLINES" > headlines.txt
          echo "Generated: $(date)" >> headlines.txt
          echo "=====================================" >> headlines.txt
          echo "" >> headlines.txt
          
          echo "--- TOP STORIES ---" >> headlines.txt
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -20 | nl >> headlines.txt
          
          echo "" >> headlines.txt
          echo "--- FEATURED STORIES ---" >> headlines.txt
          grep -oP '(?<=<h3 class="title">)[^<]*' fox_news.html | grep -v "^$" | head -20 | nl >> headlines.txt
          
          echo "✅ Extraction complete"

      - name: Commit and push results
        run: |
          git config user.name "Fox News Bot"
          git config user.email "bot@foxnews.local"
          git add fox_news.html news.json headlines.txt
          git commit -m "Fox News update: $(date -Iseconds)" || echo "No new headlines to commit"
          git push

      - name: Show summary
        run: |
          echo "## ✅ Scraping Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Headlines found:** $(grep -c '"title"' news.json)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sample Headlines:" >> $GITHUB_STEP_SUMMARY
          grep -oP '(?<=<div class="title"><span>)[^<]+' fox_news.html | head -5 | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
