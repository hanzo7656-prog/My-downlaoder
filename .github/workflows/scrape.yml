name: Simple Fox News Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Save
        run: |
          # فقط دانلود صفحه (ساده‌ترین کار)
          curl -L -H "User-Agent: Mozilla/5.0" https://www.foxnews.com/ > fox_news.html
          
          # یک فایل متنی ساده بساز
          echo "Download completed at: $(date)" > download_log.txt
          
          # یک فایل JSON خالی ولی معتبر
          echo '{"status":"success","time":"'$(date -Iseconds)'","message":"File downloaded"}' > status.json
          
          # نمایش اطلاعات برای دیباگ
          echo "✅ File size: $(wc -c < fox_news.html) bytes"
          echo "✅ First 100 lines of HTML:"
          head -5 fox_news.html
      
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fox_news.html download_log.txt status.json
          git commit -m "Update from action - $(date -Iseconds)" || echo "No changes to commit"
          git push
