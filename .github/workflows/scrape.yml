name: Fox News Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # برای نوشتن در مخزن
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      - name: Fetch Fox News RSS
        run: |
          # دانلود RSS
          curl -L "https://moxie.foxnews.com/google-publisher/latest.xml" > fox.rss
          
          # نصب xmlstarlet
          sudo apt-get update
          sudo apt-get install -y xmlstarlet
          
          # ساخت JSON
          echo '{"source":"foxnews","timestamp":"'$(date -Iseconds)'","articles":[' > news.json
          
          xmlstarlet sel -t -m "//item" -v "title" -n -v "link" -n fox.rss | head -20 | while read title; do
            read link
            if [ -n "$title" ] && [ -n "$link" ]; then
              title=$(echo "$title" | sed 's/"/\\"/g')
              echo '{"title":"'$title'","link":"'$link'"},' >> news.json
            fi
          done
          
          sed -i '$ s/,$//' news.json
          echo ']}' >> news.json
          
          # اضافه کردن timestamp برای لاگ
          echo "Last update: $(date)" > last_update.txt
      
      - name: Commit and Push to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json last_update.txt fox.rss
          git commit -m "Auto-update news - $(date -Iseconds)" || echo "No changes to commit"
          git push
